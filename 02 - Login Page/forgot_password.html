<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CineMax</title>

    <link rel="stylesheet" href="login_page.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="cinema-login-page">

    <!-- Background -->
    <div class="cinema-login-background" aria-hidden="true"></div>
    <div class="cinema-login-overlay" aria-hidden="true"></div>
    <div class="cinema-login-light" aria-hidden="true"></div>
    <div class="cinema-login-grain" aria-hidden="true"></div>

    <div class="cinema-login-container">

        <!-- Header -->
        <header class="cinema-login-header">

            <a href="landing_page.html" class="cinema-login-logo">
                CINEMAX
            </a>

            <nav class="cinema-login-nav" aria-label="Main navigation">
                <a href="landing_page.html">Home</a>
                <a href="signup_page.html">Sign Up</a>
                <a href="features_page.html">Features</a>
                <a href="about_us.html">About Us</a>
                <a href="subscription_page.html" class="cinema-login-subscribe">
                    Subscribe <span>↗</span>
                </a>
            </nav>

        </header>

        <!-- Main Content -->
        <main class="cinema-login-main">

            <section class="cinema-login-card" aria-labelledby="recovery-title">

                <div class="cinema-login-ticket-line"></div>

                <div class="cinema-login-admit">
                    <i data-lucide="ticket"></i>
                    <span>ACCOUNT RECOVERY</span>
                </div>

                <div class="cinema-login-heading cinema-recovery-heading">
                    <h1 id="recovery-title">
                        Forgot your
                        <em>password?</em>
                    </h1>

                    <p>
                        Don't worry. Enter the email address associated
                        with your CineMax account to begin the recovery process.
                    </p>
                </div>

                <form action="forgot_password.php" method="POST"
                      id="recovery-form">

                    <div class="cinema-login-field">
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder=" "
                            autocomplete="email"
                            required
                        >

                        <label for="email">Email Address</label>
                    </div>

                    <button type="submit" class="cinema-login-button">
                        <span>Reset Password</span>
                    </button>

                </form>

                <div class="cinema-login-divider">
                    <span></span>
                    <p>YOUR NEXT FILM AWAITS</p>
                    <span></span>
                </div>

                <p class="cinema-login-signup cinema-recovery-back">
                    Remember your password?
                    <a href="login_page.html">Back to Log In</a>
                </p>

            </section>

        </main>

        <!-- Footer -->
        <footer class="cinema-login-footer">
            <p>&copy; 2026 CineMax. All rights reserved.</p>
        </footer>

    </div>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
