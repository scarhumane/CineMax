
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In | CineMax</title>

    <link rel="stylesheet" href="login_page.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="login_page.js" defer></script>
</head>

<body class="cinema-login-page">

    <div class="cinema-login-background" aria-hidden="true"></div>
    <div class="cinema-login-overlay" aria-hidden="true"></div>
    <div class="cinema-login-light" aria-hidden="true"></div>
    <div class="cinema-login-grain" aria-hidden="true"></div>

    <div class="cinema-login-container">

        <!-- Header -->
        <header class="cinema-login-header">

            <a href="landing_page.html" class="cinema-login-logo">
                CINEMAX
            </a>

            <nav class="cinema-login-nav">
                <a href="landing_page.html">Home</a>
                <a href="signup_page.html">Sign Up</a>
                <a href="features_page.html">Features</a>
                <a href="about_us.html">About Us</a>
                <a href="subscription_page.html" class="cinema-login-subscribe">
                    Subscribe <span>↗</span>
                </a>
            </nav>

        </header>

        <!-- Login -->
        <main class="cinema-login-main">

            <section class="cinema-login-card">

                <div class="cinema-login-ticket-line"></div>

                <div class="cinema-login-admit">
                    <i data-lucide="ticket"></i>
                    <span>MEMBERS ONLY</span>
                </div>

                <div class="cinema-login-heading">
                    <h1>
                        Welcome back,<br>
                        <em>the show awaits.</em>
                    </h1>

                    <p>
                        Log in to pick up where you left off.
                    </p>
                </div>

                <form
                    id="login-form"
                    action="login_page.php"
                    method="post"
                >

                    <div class="cinema-login-field">
                        <input
                            type="text"
                            id="login"
                            name="login"
                            placeholder=" "
                            autocomplete="username"
                            required
                        >

                        <label for="login">
                            Username or Email Address
                        </label>
                    </div>

                    <div class="cinema-login-field cinema-password-field">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder=" "
                            autocomplete="current-password"
                            required
                        >

                        <label for="password">
                            Password
                        </label>

                        <button
                            type="button"
                            id="toggle-password"
                            class="cinema-password-toggle"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <i data-lucide="eye-off"></i>
                        </button>

                    </div>

                    <div class="cinema-login-options">
                        <a href="forgot_password.html">
                            Forgot Password?
                        </a>
                    </div>

                    <p
                        id="login-error"
                        class="login-error"
                        role="alert"
                        aria-live="polite"
                    ></p>

                    <button type="submit" class="cinema-login-button">
                        <span>Log In</span>
                    </button>

                </form>

                <div class="cinema-login-divider">
                    <span></span>
                    <p>YOUR NEXT FILM AWAITS</p>
                    <span></span>
                </div>

                <p class="cinema-login-signup">
                    New to CineMax?
                    <a href="signup_page.html">Create an Account</a>
                </p>

            </section>

        </main>

        <!-- Footer -->
        <footer class="cinema-login-footer">
            <p>&copy; 2026 CineMax. All rights reserved.</p>
        </footer>

    </div>

</body>
</html>
