<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="login_page.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="login_page.js" defer></script>
</head>
<body>
    <div class="login-container signup-page">
        <header class="homepage-header">
            <a href="landing_page.html" class="website-logo">CINEMAX</a>
            <nav class="homepage-nav-pill">
                <a href="landing_page.html">Home</a>
                <a href="features .html">Features</a>
                <a href="about_us.html">About Us</a>
                <a href="subscribe.html" class="nav-subscribe">Subscribe ↗</a>
            </nav>
        </header>

        <main class="signup-content">
         <form id="login-form" action="login_page.php" method="post">

    <label for="login">Username or Email Address</label>
    <input type="text" id="login" name="login"
           autocomplete="username" required>

    <div class="password-label-row">
        <label for="password">Password</label>
        <p class="forgot-password">
            <a href="forgot_password.php">Forgot Password?</a>
        </p>
    </div>

    <div class="password-container">
        <input type="password" id="password" name="password"
               autocomplete="current-password" required>

        <button type="button" id="toggle-password"
                aria-label="Show password" aria-pressed="false">
            <i data-lucide="eye-off"></i>
        </button>
    </div>

    <input type="submit" value="Log In" class="login-button">

    <p class="signup-link">
        Don't have an account?
        <a href="signup.html">Sign Up</a>
    </p>

    </form>
    </main>

        <footer class="login-footer">
            <p>&copy; 2026 CineMax. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
