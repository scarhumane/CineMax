<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | CineMax</title>

    <link rel="stylesheet" href="login_page.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="login_page.js" defer></script>
</head>

<body>
    <div class="login-container signup-page">

        <header class="homepage-header">
            <a href="landing_page.html" class="website-logo">CINEMAX</a>

            <nav class="homepage-nav-pill">
                <a href="landing_page.html">Home</a>
                <a href="features_page.html">Features</a>
                <a href="about_us.html">About Us</a>
                <a href="subscription_page.html" class="nav-subscribe">Subscribe ↗</a>
            </nav>
        </header>

       <main class="signup-content">

    <h1 class="signup-title">Create your Account</h1>

    <p class="signup-description">
        Join CineMax and discover films worth talking about!
    </p>

    <form id="signup-form" action="signup.php" method="post">

        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               autocomplete="username" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               autocomplete="email" required>

        <label for="password">Password</label>
        <div class="password-container">
            <input type="password" id="password" name="password"
                   autocomplete="new-password" minlength="8" required>

            <button type="button" id="toggle-password"
                    aria-label="Show password" aria-pressed="false">
                <i data-lucide="eye-off"></i>
            </button>
        </div>

        <label for="confirm_password">Confirm Password</label>
        <div class="password-container">
            <input type="password" id="confirm_password"
                   name="confirm_password"
                   autocomplete="new-password" minlength="8" required>

            <button type="button" id="toggle-confirm-password"
                    aria-label="Show password" aria-pressed="false">
                <i data-lucide="eye-off"></i>
            </button>
        </div>

        <input type="submit" value="Create Account"
               class="login-button">

        <p class="signup-link">
            Already have an account?
            <a href="login_page.html">Log In</a>
        </p>

    </form>
</main>
        <footer class="login-footer">
            <p>&copy; 2026 CineMax. All rights reserved.</p>
        </footer>

    </div>
</body>
</html>
