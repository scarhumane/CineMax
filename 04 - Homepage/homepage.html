
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineMax — Home</title>

    <link rel="stylesheet" href="homepage.css">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="homepage.js" defer></script>
    <script src="profile_menu.js" defer></script>
</head>

<body>

    <div class="homepage-container">

        <!-- HEADER -->
        <header class="homepage-header">

            <a href="homepage.php" class="website-logo">
                CINEMAX
            </a>

            <nav class="homepage-nav">
                <a href="homepage.php" class="active">Home</a>
                <a href="movies.php">Movies</a>
                <a href="genres.php">Genres</a>
                <a href="people.php">People</a>
                <a href="watchlist.php">Watchlist</a>
            </nav>

            <div class="header-right">

                <div class="search-container">
                    <i data-lucide="search"></i>

                    <input
                        type="search"
                        id="homepage-search"
                        placeholder="Search movies..."
                        autocomplete="off"
                        aria-label="Search movies"
                    >
                </div>

                <!-- SHARED PROFILE MENU -->
                {{profile_menu}}

            </div>

        </header>


        <!-- MAIN CONTENT -->
        <main id="home">

            <!-- CINEMA SHOWCASE -->
            <section class="hero-section">

                <div class="hero" id="cinemaShowcase"></div>

                <div class="dots" id="dots"></div>

            </section>


            <p
                class="service-status"
                id="movie-service-status"
                role="status"
                hidden
            ></p>


            <!-- SEARCH RESULTS -->
            <section
                class="content-section search-results-section"
                id="search-results-section"
                hidden
            >

                <div class="section-header">
                    <h2 id="search-title">Search Results</h2>
                </div>

                <div
                    class="movie-grid"
                    id="search-results"
                ></div>

            </section>


            <!-- CONTINUE WATCHING -->
            <section class="content-section" id="continue">

                <div class="section-header">
                    <h2>Continue Watching</h2>
                </div>

                <div
                    class="movie-row"
                    id="continue-movies"
                ></div>

            </section>


        </main>


        <!-- FOOTER -->
        <footer class="homepage-footer">
            <p>&copy; {{current_year}} CineMax. All rights reserved.</p>
        </footer>

    </div>


    <!-- MOVIE DETAILS MODAL -->
    <div
        class="modal"
        id="movie-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
        aria-hidden="true"
        hidden
    >

        <div class="modal-overlay" data-close-modal></div>

        <div class="modal-panel">

            <button
                type="button"
                class="modal-close"
                data-close-modal
                aria-label="Close movie details"
            >
                <i data-lucide="x"></i>
            </button>

            <div class="modal-media"></div>

            <div class="modal-body"></div>

        </div>

    </div>

</body>

</html>
