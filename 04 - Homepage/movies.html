<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineMax — Movies</title>

    <link rel="stylesheet" href="homepage.css">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="movie_modal_layout.js" defer></script>
    <script src="homepage.js" defer></script>
    <script src="profile_menu.js" defer></script>
</head>

<body>

    <div class="homepage-container">

        <header class="homepage-header">

            <a href="homepage.php" class="website-logo">
                CINEMAX
            </a>

            <nav class="homepage-nav">
                <a href="homepage.php">Home</a>
                {{movie_navigation}}
                <a href="watchlist.php">Watchlist</a>
            </nav>

            <div class="header-right">

                <div class="search-container">
                    <i data-lucide="search"></i>

                    <input
                        type="search"
                        id="homepage-search"
                        placeholder="Search movies..."
                        autocomplete="off"
                        aria-label="Search movies"
                    >
                </div>

                {{profile_menu}}

            </div>

        </header>

        <main id="movie-catalog" data-admin-mode="{{admin_mode}}">

            <section
                class="content-section"
                id="admin-movies-section"
                hidden
            >
                <div class="section-header">
                    <h1>CineMax Collection</h1>
                    <p>Movies selected by the CineMax team.</p>
                </div>
                <div class="movie-grid" id="admin-movies-grid"></div>
            </section>

            <p
                class="service-status"
                id="movie-service-status"
                role="status"
                hidden
            ></p>

            <section
                class="content-section search-results-section"
                id="search-results-section"
                hidden
            >
                <div class="section-header">
                    <h1 id="search-title">Search Results</h1>
                </div>

                <div
                    class="movie-grid"
                    id="search-results"
                ></div>
            </section>

            <section class="content-section catalog-row-section" id="popular-section">
                <div class="section-header">
                    <h1>Popular Movies</h1>

                    <div class="row-controls">
                        <button type="button" class="row-control" data-row="popular-movies" data-dir="-1" aria-label="Scroll popular movies left"><i data-lucide="chevron-left"></i></button>
                        <button type="button" class="row-control" data-row="popular-movies" data-dir="1" aria-label="Scroll popular movies right"><i data-lucide="chevron-right"></i></button>
                    </div>
                </div>
                <div class="movie-row backdrop-row" id="popular-movies" aria-label="Popular movies"></div>
            </section>

            <div id="additional-movie-rows"></div>

            <section class="content-section catalog-row-section" id="horror-section">
                <div class="section-header">
                    <h2>Horror</h2>
                    <div class="row-controls">
                        <button type="button" class="row-control" data-row="horror-movies" data-dir="-1" aria-label="Scroll horror movies left"><i data-lucide="chevron-left"></i></button>
                        <button type="button" class="row-control" data-row="horror-movies" data-dir="1" aria-label="Scroll horror movies right"><i data-lucide="chevron-right"></i></button>
                    </div>
                </div>
                <div class="movie-row backdrop-row" id="horror-movies" aria-label="Horror movies"></div>
            </section>

            <section class="content-section catalog-row-section" id="comedy-section">
                <div class="section-header">
                    <h2>Comedy</h2>
                    <div class="row-controls">
                        <button type="button" class="row-control" data-row="comedy-movies" data-dir="-1" aria-label="Scroll comedy movies left"><i data-lucide="chevron-left"></i></button>
                        <button type="button" class="row-control" data-row="comedy-movies" data-dir="1" aria-label="Scroll comedy movies right"><i data-lucide="chevron-right"></i></button>
                    </div>
                </div>
                <div class="movie-row backdrop-row" id="comedy-movies" aria-label="Comedy movies"></div>
            </section>

        </main>

        <footer class="homepage-footer">
            <p>&copy; {{current_year}} CineMax. All rights reserved.</p>
        </footer>

    </div>

    <div
        class="modal"
        id="movie-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
        aria-hidden="true"
        hidden
    >

        <div class="modal-overlay" data-close-modal></div>

        <div class="modal-panel">

            <button
                type="button"
                class="modal-close"
                data-close-modal
                aria-label="Close movie details"
            >
                <i data-lucide="x"></i>
            </button>

            <div class="modal-media"></div>

            <div class="modal-body"></div>

        </div>

    </div>

</body>

</html>
