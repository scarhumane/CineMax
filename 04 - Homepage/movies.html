<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineMax — Movies</title>

    <link rel="stylesheet" href="homepage.css">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="homepage.js" defer></script>
    <script src="profile_menu.js" defer></script>
</head>

<body>

    <div class="homepage-container">

        <header class="homepage-header">

            <a href="homepage.php" class="website-logo">
                CINEMAX
            </a>

            <nav class="homepage-nav">
                <a href="homepage.php">Home</a>
                <a href="movies.php" class="active">Movies</a>
                <a href="genres.php">Genres</a>
                <a href="people.php">People</a>
                <a href="watchlist.php">Watchlist</a>
            </nav>

            <div class="header-right">

                <div class="search-container">
                    <i data-lucide="search"></i>

                    <input
                        type="search"
                        id="homepage-search"
                        placeholder="Search movies..."
                        autocomplete="off"
                        aria-label="Search movies"
                    >
                </div>

                {{profile_menu}}

            </div>

        </header>

        <main id="movie-catalog">

            <p
                class="service-status"
                id="movie-service-status"
                role="status"
                hidden
            ></p>

            <section
                class="content-section search-results-section"
                id="search-results-section"
                hidden
            >
                <div class="section-header">
                    <h1 id="search-title">Search Results</h1>
                </div>

                <div
                    class="movie-grid"
                    id="search-results"
                ></div>
            </section>

            <section class="content-section" id="movies">

                <div class="section-header">

                    <h1>Trending Movies</h1>

                    <div class="row-controls">

                        <button
                            type="button"
                            class="row-control"
                            data-row="trending"
                            data-dir="-1"
                            aria-label="Scroll trending movies left"
                        >
                            <i data-lucide="chevron-left"></i>
                        </button>

                        <button
                            type="button"
                            class="row-control"
                            data-row="trending"
                            data-dir="1"
                            aria-label="Scroll trending movies right"
                        >
                            <i data-lucide="chevron-right"></i>
                        </button>

                    </div>

                </div>

                <div
                    class="movie-row"
                    id="trending"
                ></div>

            </section>

            <section class="content-section" id="toprated">

                <div class="section-header">

                    <h2>Top Rated Movies</h2>

                    <div
                        class="row-controls"
                        role="group"
                        aria-label="Top rated movie controls"
                    >

                        <button
                            type="button"
                            class="row-control"
                            data-row="rank"
                            data-dir="-1"
                            aria-label="Scroll top rated movies left"
                        >
                            <i data-lucide="chevron-left"></i>
                        </button>

                        <button
                            type="button"
                            class="row-control"
                            data-row="rank"
                            data-dir="1"
                            aria-label="Scroll top rated movies right"
                        >
                            <i data-lucide="chevron-right"></i>
                        </button>

                    </div>

                </div>

                <ol
                    class="top-rated-list"
                    id="rank"
                    aria-label="Top 10 highest-rated movies"
                ></ol>

            </section>

        </main>

        <footer class="homepage-footer">
            <p>&copy; {{current_year}} CineMax. All rights reserved.</p>
        </footer>

    </div>

    <div
        class="modal"
        id="movie-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
        aria-hidden="true"
        hidden
    >

        <div class="modal-overlay" data-close-modal></div>

        <div class="modal-panel">

            <button
                type="button"
                class="modal-close"
                data-close-modal
                aria-label="Close movie details"
            >
                <i data-lucide="x"></i>
            </button>

            <div class="modal-media"></div>

            <div class="modal-body"></div>

        </div>

    </div>

</body>

</html>
