
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineMax — My Watchlist</title>

    <link rel="stylesheet" href="homepage.css">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="watchlist.js" defer></script>
    <script src="profile_menu.js" defer></script>
</head>

<body>

    <div class="homepage-container">

        <!-- HEADER -->
        <header class="homepage-header">

            <a href="homepage.php" class="website-logo">
                CINEMAX
            </a>

            <nav class="homepage-nav">
                <a href="homepage.php">Home</a>
                <a href="homepage.php#movies">Movies</a>
                <a href="genres.php">Genres</a>
                <a href="people.php">People</a>
                <a href="watchlist.php" class="active">Watchlist</a>
            </nav>

            <div class="header-right">

                <div class="search-container">
                    <i data-lucide="search"></i>

                    <input
                        type="search"
                        id="homepage-search"
                        placeholder="Search movies..."
                        autocomplete="off"
                        aria-label="Search movies"
                    >
                </div>

                {{profile_menu}}

            </div>

        </header>

        <!-- MAIN CONTENT -->
        <main>

            <!-- SEARCH RESULTS -->
            <section
                class="content-section"
                id="search-results-section"
                hidden
            >

                <div class="section-header">

                    <h1 id="search-title">Search Results</h1>

                    <button
                        type="button"
                        class="clear-search"
                        data-clear-search
                    >
                        Clear Search
                    </button>

                </div>

                <p
                class="search-results-count"
                id="search-results-count"
                hidden
                ></p>

               <div
                class="movie-row"
                id="search-results"
                aria-live="polite"
                ></div>
            </section>

            <!-- WATCHLIST -->
            <section class="content-section" id="watchlist">

                <div class="section-header">
                    <h1>My Watchlist</h1>
                    <p>Keep track of the movies you want to watch next.</p>
                </div>

                <!-- WATCHLIST MOVIES -->
                <div
                    class="movie-row"
                    id="watchlist-movies"
                ></div>

                <!-- EMPTY WATCHLIST -->
                <p
                    class="empty-watchlist"
                    id="empty-watchlist"
                    hidden
                >
                    Your watchlist is empty. Add movies you want to watch!
                </p>

            </section>

        </main>

        <!-- MOVIE DETAILS MODAL -->
        <div
            class="modal"
            id="movie-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
            aria-hidden="true"
            hidden
        >

            <div class="modal-overlay" data-close-modal></div>

            <div class="modal-panel">

                <button
                    type="button"
                    class="modal-close"
                    data-close-modal
                    aria-label="Close movie details"
                >
                    <i data-lucide="x"></i>
                </button>

                <div class="modal-media"></div>
                <div class="modal-body"></div>

            </div>

        </div>

        <!-- FOOTER -->
        <footer class="homepage-footer">
            <p>&copy; {{current_year}} CineMax. All rights reserved.</p>
        </footer>

    </div>

    <script>
        if (typeof lucide !== "undefined") {
            lucide.createIcons();
        }
    </script>

</body>

</html>
