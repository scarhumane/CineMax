<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMax</title>
    <link rel="stylesheet" href="../login_page.css">
    
</head>
<body>

    <div class="login-container">

        <header class="login-header">
            <a href="login_page.html" class="website-logo">CINEMAX</a>
            <a href="../login_page.php" class="sign-in-button">Sign In</a>
        </header>

        <main class="login-content">

            <h1>Welcome to CineMax</h1>
            <p class="login-subtitle">Sign in to your CineMax Account</p>

            <form id="login-form" action="../login_page.php" method="post">

                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <br><br>

                <input type="submit" value="Login" class="login-button">

            </form>

        </main>

    </div>

</body>
</html>
